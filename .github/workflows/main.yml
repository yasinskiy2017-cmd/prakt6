name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore NuGet packages
        run: dotnet restore MovieCatalogApp.csproj

      - name: Build installable Debug APK
        run: dotnet publish MovieCatalogApp.csproj -f net10.0-android -c Debug -p:AndroidPackageFormat=apk -o ./artifacts/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieCatalogApp-Android-APK
          path: ./artifacts/android/*.apk
          if-no-files-found: error
